name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  installer:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import solarpv; print(solarpv.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Freeze with PyInstaller
        run: pyinstaller packaging/solarpv.spec --noconfirm
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SolarPVDesigner-Setup-${{ steps.version.outputs.version }}
          path: dist/SolarPVDesigner-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SolarPVDesigner-Setup-*.exe
          generate_release_notes: true
